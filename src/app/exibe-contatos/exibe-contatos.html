<table>
    @if(agenda.obterTodos().length > 0) {
        <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Tipo</th>
        </tr>
    }
@for (ct of agenda.obterTodos(); 
      track ct.telefone) {
    <tr>
        <td>{{ct.nome}}</td>
        <td>{{ct.telefone}}</td>
        <td>{{ct.tipo}}</td>
    </tr>
}
</table>
